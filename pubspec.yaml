name: examina
description: Quản lý chi tiêu với SQLite, MVVM và Riverpod Generator.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  shared_preferences: ^2.5.6
  path: ^1.9.1
  path_provider: ^2.1.6
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
